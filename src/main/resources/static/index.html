
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CI/CD Demo</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            background: #1f2937;
            padding: 45px;
            border-radius: 16px;
            max-width: 500px;
        }

        h1 {
            color: #60a5fa;
        }

        p {
            color: #d1d5db;
            line-height: 1.6;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>My CI/CD Demo</h1>

        <p>
            Welcome! This application is built using
            Java, Spring Boot and Docker.
        </p>

        <p>
            Successfully deployed using Render.
        </p>

        <button onclick="alert('Your application is working!')">
            Test Application
        </button>
    </div>
</body>
</html>
